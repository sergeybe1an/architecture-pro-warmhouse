version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/01-smarthome.sql:ro
      - ./device-management-service/init.sql:/docker-entrypoint-initdb.d/02-device-management.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - smarthome-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: smarthome-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - smarthome-network
    restart: unless-stopped

  temperature-api:
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    container_name: temperature-api
    ports:
      - "8081:8081"
    networks:
      - smarthome-network
    restart: unless-stopped

  device-management:
    build:
      context: ./device-management-service
      dockerfile: Dockerfile
    container_name: device-management
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/device_management
      - RABBITMQ_HOST=rabbitmq
    ports:
      - "8082:8082"
    networks:
      - smarthome-network
    restart: unless-stopped

  temperature-telemetry:
    build:
      context: ./temperature-telemetry-service
      dockerfile: Dockerfile
    container_name: temperature-telemetry
    depends_on:
      rabbitmq:
        condition: service_started
      temperature-api:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8083:8083"
    networks:
      - smarthome-network
    restart: unless-stopped

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      device-management:
        condition: service_started
      temperature-telemetry:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
      - USE_MICROSERVICES=true
      - DEVICE_SERVICE_URL=http://device-management:8082
      - TELEMETRY_SERVICE_URL=http://temperature-telemetry:8083
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge
